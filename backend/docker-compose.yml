services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gym
    ports:
      - "5432:5432"
    volumes:
      - gym_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - gym_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: sh -c "npx prisma migrate deploy && node dist/main.js"
    env_file: .env
    environment:
      # Local docker DB (overrides remote DATABASE_URL from .env)
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/gym
      DATABASE_URL_LOCAL: postgresql://postgres:postgres@postgres:5432/gym
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      APP_URL: http://localhost:3000
      TZ: Asia/Karachi
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - gym_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: node dist/worker.js
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/gym
      DATABASE_URL_LOCAL: postgresql://postgres:postgres@postgres:5432/gym
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      TZ: Asia/Karachi
    volumes:
      - gym_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  gym_pg:
  gym_redis:
  gym_uploads:
