# Repo root is not the Node app — API lives in backend/ (Dokploy / Railway / Nixpacks).

[variables]
NIXPACKS_NODE_VERSION = "20"
# Keep devDependencies in image so nest build works; avoid prune dropping dist build toolchain
NIXPACKS_INSTALL_DEV_DEPS = "true"

[phases.setup]
nixPkgs = ["nodejs_20", "openssl"]

[phases.install]
dependsOn = ["setup"]
# Dokploy sets NODE_ENV=production — devDeps required for nest build + prisma
cmds = [
  "cd backend && NPM_CONFIG_PRODUCTION=false npm install --include=dev",
]

[phases.build]
dependsOn = ["install"]
cmds = [
  "cd backend && npx prisma generate",
  "cd backend && npx nest build",
  "test -f backend/dist/main.js || (echo 'Nixpacks build failed: backend/dist/main.js missing' && exit 1)",
]

[start]
cmd = "cd backend && sh scripts/start-prod.sh"
