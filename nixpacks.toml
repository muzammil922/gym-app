# Repo root is not the Node app — API lives in backend/ (Dokploy / Railway / Nixpacks).

[variables]
NIXPACKS_NODE_VERSION = "20"

[phases.setup]
nixPkgs = ["nodejs_20", "openssl"]

[phases.install]
dependsOn = ["setup"]
cmds = ["cd backend && (npm ci || npm install)"]

[phases.build]
dependsOn = ["install"]
cmds = [
  "cd backend && npx prisma generate",
  "cd backend && npm run build",
]

[start]
cmd = "cd backend && npx prisma migrate deploy && node dist/main.js"
